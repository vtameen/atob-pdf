name: build-installers
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack sources
        run: python -m zipfile -e atob-pdf-payload.zip .
      - name: Build app bundle
        run: node build.mjs
      - name: Stage app
        shell: bash
        run: |
          mkdir -p electron/app
          cp dist/AtoB-PDF.html electron/app/AtoB-PDF.html
      - name: Build installer
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: AtoB-PDF-Windows-Installer
          path: electron/release/*.exe

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack sources
        run: python3 -m zipfile -e atob-pdf-payload.zip .
      - name: Build app bundle
        run: node build.mjs
      - name: Stage app
        run: |
          mkdir -p electron/app
          cp dist/AtoB-PDF.html electron/app/AtoB-PDF.html
      - name: Build installer
        working-directory: electron
        run: |
          npm install
          npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: AtoB-PDF-macOS-Installer
          path: electron/release/*.dmg

  release:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: AtoB PDF 3.2.0
          body: |
            Offline PDF toolkit for Windows and macOS. Download the installer for your system below:
            - Windows: "AtoB PDF Setup 3.2.0.exe"
            - macOS: "AtoB PDF-3.2.0-universal.dmg" (Intel + Apple Silicon)

            See the README for install steps and first-run notes.
          files: installers/*
