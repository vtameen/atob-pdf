name: build-installers
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack sources
        run: python -m zipfile -e atob-pdf-payload.zip .
      - name: Build app bundle
        run: node build.mjs
      - name: Stage app
        shell: bash
        run: |
          mkdir -p electron/app
          cp dist/AtoB-PDF.html electron/app/AtoB-PDF.html
      - name: Build installer
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: AtoB-PDF-Windows-Installer
          path: electron/release/*.exe

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack sources
        run: python3 -m zipfile -e atob-pdf-payload.zip .
      - name: Build app bundle
        run: node build.mjs
      - name: Stage app
        run: |
          mkdir -p electron/app
          cp dist/AtoB-PDF.html electron/app/AtoB-PDF.html
      - name: Build installer
        working-directory: electron
        run: |
          npm install
          npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: AtoB-PDF-macOS-Installer
          path: electron/release/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unpack sources
        run: python3 -m zipfile -e atob-pdf-payload.zip .
      - name: Build app bundle
        run: node build.mjs
      - name: Stage app
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/AtoB-PDF.html android/app/src/main/assets/AtoB-PDF.html
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "AtoB-PDF-3.2.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AtoB-PDF-Android-APK
          path: AtoB-PDF-3.2.0.apk

  release:
    needs: [ windows, mac, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: AtoB PDF 3.2.0
          body: |
            Offline PDF toolkit for Windows, macOS and Android. Download the file for your system below:
            - Windows: "AtoB PDF Setup 3.2.0.exe"
            - macOS: "AtoB PDF-3.2.0-universal.dmg" (Intel + Apple Silicon)
            - Android: "AtoB-PDF-3.2.0.apk" (Android 10 or newer)

            See the README for install steps and first-run notes.
          files: installers/*
